<style>
:root{--bg:#242423;--card:#2e2e2c;--ink:#ffffff;--mute:#b4b4ae;--line:#43433f;--acc:#f5cb5c;--acc-ink:#242423;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
a{color:var(--acc)}
.back{display:inline-block;margin-bottom:12px;font-size:.92rem;text-decoration:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.grow{flex:1 1 140px}.sm{flex:0 0 78px}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:9px 13px}
button:hover{filter:brightness(1.08)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.ghost{border:none;background:none;color:var(--mute);padding:6px 8px;font-weight:400}
button.ghost:hover{filter:none;color:var(--ink)}
.stats{display:flex;gap:18px;margin:10px 0 16px}
.stat b{display:block;font-size:1.4rem}.stat span{color:var(--mute);font-size:.8rem}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:.78rem;color:var(--mute)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .t{flex:1;min-width:0}.item .t b{display:block;overflow-wrap:anywhere}
.item .t small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}.qty button{padding:4px 11px}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.boxlink{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink)}
.boxlink small{color:var(--mute)}
label.l{display:block;font-size:.8rem;color:var(--mute);margin:0 0 4px}
details{margin-top:18px}summary{cursor:pointer;color:var(--mute)}
textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,monospace;margin-top:8px}
.note{font-size:.85rem;color:var(--mute);margin-top:8px}
.th{width:40px;height:56px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
#res{margin-top:6px}
select.pr{padding:3px 6px;font-size:.8rem}
.acct{font-size:.88rem;color:var(--mute)}
.err{color:#ff8f87}
.th[data-hi]{cursor:zoom-in}
#zoom{position:fixed;z-index:50;pointer-events:none;width:280px;aspect-ratio:600/825;border-radius:14px;background:var(--line) center/contain no-repeat;box-shadow:0 14px 44px rgba(0,0,0,.65);display:none;overflow:hidden}
#zoom img{display:block;width:100%;height:100%;object-fit:contain}
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:600/825;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.hd{max-width:720px;margin:0 auto;padding:16px 16px 0}.hd a{display:block}.hd svg,.hd img{display:block;width:100%;height:auto;border-radius:14px}
</style>

<script>
var KEY='pkbox:v1',S={boxes:{}},q='';
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)||S;if(!S.boxes)S.boxes={}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){var b=S.boxes[location.hash.slice(1)];if(b)b.t=Date.now();persist();push()}
var SUPABASE_URL='https://acobfzadvymmrmuywtxm.supabase.co',SUPABASE_KEY='sb_publishable_4313Hd13DH1fg3gF2bUCGw_aClDsIhl';
var ARR=location.search+location.hash,NOTE='';  // what the email link brought us back with
var CONTACT='';  // optional: how customers can reach you, e.g. "email hello@yourshop.com"
var HEADER_IMG='';  // optional: web address of your own logo or banner image, to use instead of the built-in graphic
var CODE=/^box-[0-9a-f]{12}$/;  // format of the codes made by nfc-tags-setup.sql
var want='',sb=null,U=null,st='',pt,rec=false;
try{if(SUPABASE_URL&&SUPABASE_KEY&&window.supabase)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce'}})}catch(e){}
function setSt(s){st=s;var e=$('#st');if(e)e.textContent=s}
function push(){if(!sb||!U)return;clearTimeout(pt);pt=setTimeout(doPush,800)}
async function doPush(){
  if(!sb||!U)return;
  var rows=[];
  Object.keys(S.boxes).forEach(function(i){var b=S.boxes[i];if(!CODE.test(i))return;if(!b.t)b.t=Date.now();if(b.t>(b.s||0))rows.push({user_id:U.id,id:i,name:b.name,cards:b.cards,updated_at:new Date(b.t).toISOString()})});
  try{
    if(S.gone&&S.gone.length){var g=await sb.from('boxes').delete().in('id',S.gone);if(g.error)throw g.error;S.gone=[]}
    if(rows.length){var r=await sb.from('boxes').upsert(rows,{onConflict:'user_id,id'});if(r.error)throw r.error;rows.forEach(function(x){S.boxes[x.id].s=Date.parse(x.updated_at)})}
    persist();setSt('Synced');
  }catch(e){setSt('Sync failed. Changes are kept on this device.')}
}
async function sync(){
  if(!sb||!U)return;setSt('Syncing…');
  var r=await sb.from('boxes').select('id,name,cards,updated_at');
  if(r.error){setSt('Sync failed. Changes are kept on this device.');return}
  var ch=false;
  (r.data||[]).forEach(function(w){
    if((S.gone||[]).indexOf(w.id)>-1)return;
    var t=Date.parse(w.updated_at),l=S.boxes[w.id];
    if(!l||t>(l.t||0)){S.boxes[w.id]={name:w.name,cards:w.cards||[],t:t,s:t};ch=true}
  });
  persist();await doPush();
  if(ch)render();
}
function bar(){
  var app=$('#app'),h='';if(!app||!sb)return;
  if(rec&&U)h='<div class="card acct"><b>Set a new password</b><div class="row" style="margin-top:8px"><input id="np" class="grow" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><button class="pri" onclick="setPw()">Save</button></div><p class="note err" id="am"></p></div>';
  else if(U)h='<div class="card acct row" style="justify-content:space-between;align-items:center"><span>'+esc(U.email||'')+' · <span id="st">'+esc(st)+'</span></span><button onclick="out()">Sign out</button></div>';
  else h='<details class="card acct"'+(want&&!U?' open':'')+'><summary>Sign in to sync across devices</summary><div class="row" style="margin-top:10px"><input id="ae" class="grow" type="email" placeholder="Email" autocomplete="email"><input id="ap" class="grow" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"></div><div class="row" style="margin-top:8px"><button class="pri" onclick="auth(0)">Sign in</button><button onclick="auth(1)">Create account</button></div><div class="row" style="margin-top:6px"><button class="ghost" onclick="link(0)">Email me a sign-in link</button><button class="ghost" onclick="link(1)">Forgot password?</button></div><p class="note err" id="am"></p></details>';
  if(U&&NOTE&&NOTE.indexOf('signed in.')<0)NOTE='';
  if(NOTE&&!rec)h='<div class="card acct" role="status">'+esc(NOTE)+'</div>'+h;
  app.insertAdjacentHTML('afterbegin',h);
}
async function auth(m){
  var e=$('#ae').value.trim(),p=$('#ap').value,am=$('#am');am.textContent='';
  if(!e||p.length<6){am.textContent='Enter an email and a password of at least 6 characters.';return}
  var r=m?await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){am.textContent=r.error.message;return}
  if(m&&!r.data.session)am.textContent='Check your email to confirm your account, then sign in.';
}
async function out(){
  if(!confirm('Sign out? Your cards stay in your account and are removed from this device.'))return;
  await doPush();
  if(st.indexOf('failed')>-1&&!confirm('Some changes could not be synced and will be lost from this device. Sign out anyway?'))return;
  S={boxes:{}};persist();await sb.auth.signOut();location.hash='';
}
function msg(t,bad){var m=$('#am');if(!m)return;m.className='note'+(bad?' err':'');m.textContent=t}
async function link(reset){
  var e=$('#ae').value.trim();
  if(!e){msg('Enter your email first.',1);return}
  var url=location.origin+location.pathname;
  var r=reset?await sb.auth.resetPasswordForEmail(e,{redirectTo:url}):await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:url}});
  if(r.error){msg(r.error.message,1);return}
  msg('Check your email for the link, and open it in this same browser.');
}
async function setPw(){
  var p=$('#np').value;
  if(p.length<6){msg('Use at least 6 characters.',1);return}
  var r=await sb.auth.updateUser({password:p});
  if(r.error){msg(r.error.message,1);return}
  rec=false;render();sync();
}
async function initAuth(){
  if(!sb)return;
  try{var s=await sb.auth.getSession();U=s.data.session?s.data.session.user:null}catch(e){}
  if(/error_code=|error=access_denied/.test(ARR))NOTE='That email link has expired or was already used. Sign in below, or use Forgot password to get a new one.';
  else if(/[?&]code=|type=signup/.test(ARR))NOTE=U?'You\u2019re signed in.':'Email confirmed. Please sign in to continue.';
  sb.auth.onAuthStateChange(function(ev,sess){var nu=sess?sess.user:null,chg=(nu&&nu.id)!=(U&&U.id);U=nu;if(ev==='PASSWORD_RECOVERY')rec=true;if(chg||ev==='PASSWORD_RECOVERY'){render();if(U&&!rec){setTimeout(sync,0);goPending()}}});
  render();if(U){sync();goPending()}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&U)sync()});
}

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
var COND={NM:1,LP:.85,MP:.65,HP:.45,DMG:.25};
function priced(c){return typeof c.p=='number'&&COND[c.cond]!=null}
function fmt(n){return '$'+n.toFixed(2)}
function totals(b){var n=0,v=0,pc=0;b.cards.forEach(function(c){n+=c.qty;if(priced(c)){v+=c.p*COND[c.cond]*c.qty;pc++}});return{u:b.cards.length,t:n,v:v,pc:pc}}

function render(){view();bar()}
function view(){
  var id=location.hash.slice(1),app=$('#app');if(id.indexOf('=')>-1)id='';want='';
  if(!id)return home(app);
  var b=S.boxes[id];
  if(!b)return tagView(app,id);
  boxView(app,id,b);
}

function home(app){
  var ids=Object.keys(S.boxes),h='<h1>Register a Box</h1><p class="sub">Scan the tag on your box to register it and start tracking its cards.</p>';
  h+='<div class="card"><label class="l">Have a box code?</label><div class="row"><input id="bc" class="grow" placeholder="e.g. box-3f9a1c0d2e4b"><button onclick="goCode()">Open</button></div></div>';
  if(!ids.length)h+='<div class="empty">No boxes yet. Scan the tag on your box to register it.</div>';
  ids.forEach(function(i){var b=S.boxes[i],t=totals(b);
    h+='<a class="card boxlink" href="#'+i+'"><span><b>'+esc(b.name)+'</b><br><small>'+t.t+' cards · '+t.u+' unique'+(t.pc?' · ~'+fmt(t.v):'')+'</small></span><span class="chip">'+i+'</span></a>'});
  app.innerHTML=h;
}
function makeBox(id){var n=$('#bn').value.trim()||id;S.boxes[id]={name:n,cards:[],t:Date.now()};save();render()}

function boxView(app,id,b){
  var t=totals(b),h='<a class="back" href="#">← All boxes</a><h1>'+esc(b.name)+'</h1><p class="sub"><span class="chip">'+id+'</span></p>';
  h+='<div class="stats"><div class="stat"><b>'+t.t+'</b><span>total cards</span></div><div class="stat"><b>'+t.u+'</b><span>unique</span></div><div class="stat"><b>'+(t.pc?fmt(t.v):'—')+'</b><span>est. value'+(t.pc&&t.pc<t.u?' ('+t.pc+' of '+t.u+' priced)':'')+'</span></div></div>';
  var lp=lastPriced(b);
  h+='<div class="row" style="margin:-6px 0 4px;align-items:center"><button onclick="priceBox()">Update prices</button><span class="note" id="pst" style="margin:0">'+(lp?'Prices updated '+new Date(lp).toLocaleDateString():'')+'</span></div><p class="note" style="margin:4px 0 14px">Estimate uses the TCGplayer market price (USD) for the printing chosen on each card (normal by default; pick holo or reverse after updating prices), adjusted for condition (LP 85%, MP 65%, HP 45%, DMG 25%). Graded cards and hand-added cards are not priced.</p>';
  h+='<div class="card"><label class="l">Add a card</label><form onsubmit="return addCard(event)"><div class="row">'
   +'<input id="cn" class="grow" placeholder="Search card name…" required autocomplete="off" oninput="srch(this.value)">'
   +'<input id="cs" class="grow" placeholder="Set (e.g. Obsidian Flames)">'
   +'<input id="cx" class="sm" placeholder="No.">'
   +'<input id="cq" class="sm" type="number" min="1" value="1" aria-label="Quantity">'
   +'<select id="cc"><option>NM</option><option>LP</option><option>MP</option><option>HP</option><option>DMG</option><option>Graded</option></select>'
   +'<button class="pri" type="submit">Add manually</button></div></form><div id="res"></div>'
   +'<div class="row" style="margin-top:10px;align-items:center"><span class="note" style="margin:0">Have your collection in another app?</span><button onclick="impPick()">Import CSV</button><input type="file" id="impf" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" hidden onchange="impFile(this)"></div></div>';
  h+='<div id="imp"></div>';
  h+='<div class="row" style="margin-bottom:12px"><input id="sq" class="grow" placeholder="Search this box…" value="'+esc(q)+'" oninput="q=this.value;window.list()"><select id="so" aria-label="Sort cards" onchange="setSort(this.value)">'+SORTS.map(function(o){return'<option value="'+o[0]+'"'+(o[0]==srt?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>';
  h+='<div class="row" id="fb" style="margin:-4px 0 12px;align-items:center"></div>';
  h+='<div class="card" id="list"></div>';
  h+='<div class="row" style="align-items:center;margin:-2px 0 12px"><button onclick="copyList()">Copy list</button><button onclick="dlCsv()">Download CSV</button><button class="ghost" onclick="clearBox()">Delete all cards</button><span class="note" id="exs" style="margin:0"></span></div>';
  h+='<details><summary>Tag link, backup &amp; delete</summary><div class="card" style="margin-top:10px"><label class="l">Link to this box</label><div class="row"><input id="lk" class="grow" readonly value="'+esc(location.href.split('#')[0]+'#'+id)+'" onfocus="this.select()"><button onclick="cp()">Copy</button></div>'
   +'<p class="note">Cards are saved in this browser on this device. To move them, copy the backup text below and paste it into the same box on another device.</p>'
   +'<textarea id="bk" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button onclick="showBk()">Show backup</button><button onclick="restore()">Restore from pasted text</button><button class="ghost" onclick="delBox()">Delete box</button></div></div></details>';
  app.innerHTML=h;filtBar();list();impDraw();
  var hh=location.hash;fillTypes().then(function(ch){if(ch&&location.hash==hh){filtBar();list()}});
}
function list(){
  var id=location.hash.slice(1),b=S.boxes[id],el=$('#list');if(!b||!el)return;

  set:['set','setname','expansion','expansionname','edition','groupname','setfullname','settitle'],

function hk(h){h=String(h||'').trim();return h=='#'?'number':h.toLowerCase().replace(/[^a-z0-9]+/g,'')}
function impDetect(head){
  var ks=head.map(hk),used={},m={};
  IMF.forEach(function(f){m[f[0]]=-1});
  [0,1].forEach(function(pass){IMF.forEach(function(f){
    var k=f[0];if(m[k]>-1)return;
    IMA[k].some(function(a){
      if(pass&&a.length<4)return false;
      for(var i=0;i<ks.length;i++)if(!used[i]&&(pass?ks[i].indexOf(a)>-1:ks[i]==a)){m[k]=i;used[i]=1;return true}
      return false;
    });
  })});
  return m;
}
function parseCSV(t){
  t=String(t).replace(/^﻿/,'');
  var first=t.split(/\r?\n/).filter(function(l){return l.trim()&&!/^sep=/i.test(l)})[0]||'';
  var d=[',',';','\t'].sort(function(a,b){return first.split(b).length-first.split(a).length})[0];
  var rows=[],row=[],f='',qt=false,c,i;
  for(i=0;i<t.length;i++){c=t[i];
    if(qt){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else qt=false}else f+=c}
    else if(c=='"'&&!f.trim())qt=true,f='';
    else if(c==d){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return x.trim()})&&!(r.length==1&&/^sep=/i.test(r[0]))});
}
function impCond(v,def){
  var s=String(v||'').toLowerCase().trim();if(!s)return def;
  if(/psa|bgs|cgc|sgc|beckett|grad|slab/.test(s))return'Graded';
  if(/dmg|damag|poor/.test(s))return'DMG';
  if(/heav|\bhp\b/.test(s))return'HP';
  if(/moder|\bmp\b|\bgood\b|\bgd\b/.test(s))return'MP';
  if(/light|\blp\b|excellent|\bex\b|\bsp\b|slight/.test(s))return'LP';
  if(/mint|\bnm\b|\bm\b|\bnew\b/.test(s))return'NM';
  if(/played|\bpl\b/.test(s))return'MP';
  return def;
}
function impPr(v){
  var s=String(v||'').toLowerCase().trim();
  if(/^(true|yes|y|1|x)$/.test(s))return'holo';
  if(/^(false|no|n|0)$/.test(s))return'normal';
  if(/reverse|\brev\b|\brh\b/.test(s))return'reverse';
  if(/non-?\s?(foil|holo)/.test(s))return'normal';
  if(/holo|foil/.test(s))return'holo';
  if(/normal|regular|unlimited|standard/.test(s))return'normal';
  return'';
}

    if(it.length>5)h+='<p class="note" style="margin:4px 0 0">…and '+(it.length-5)+' more.</p>';
    if(IMP.skip)h+='<p class="note" style="margin:4px 0 0">'+IMP.skip+' row'+(IMP.skip>1?'s':'')+' with a quantity of 0 will be skipped.</p>';
    h+='<div class="row" style="margin-top:12px;align-items:center">'+(it.length?'<button class="pri" '+(IMP.busy?'disabled ':'')+'onclick="impGo()">Import '+n+' card'+(n==1?'':'s')+'</button>':'<span class="note err" style="margin:0">No cards found with this column setup.</span>')+'<button class="ghost" onclick="impCancel()">Cancel</button></div>';
  }
  h+='<p class="note" id="imps"></p></div>';
  el.innerHTML=h;
}
function nk(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'')}
function nnum(s){return String(s||'').trim().toLowerCase().replace(/^0+(?=\w)/,'')}
function baseName(s){return String(s||'').replace(/\s*[\(\[][^\)\]]*[\)\]]\s*/g,' ').replace(/\s+-\s+.*$/,'').trim()}
function setHit(a,b){a=nk(a);b=nk(b);if(!a||!b)return false;if(a==b)return true;var s=a.length<b.length?a:b,l=a.length<b.length?b:a;return s.length>=3&&l.indexOf(s)>-1}
async function impMatch(items,prog){
  var sets=await setsMap(),found={},list=[];
  items.forEach(function(it){var k=baseName(it.name);if(k&&!(k in found)){found[k]=null;list.push(k)}});
  var done=0,qu=list.slice();
  await Promise.all([1,2,3,4,5].map(async function(){while(qu.length){var n=qu.shift();
    try{var r=await fetch('https://api.tcgdex.net/v2/en/cards?name='+encodeURIComponent(n));if(r.ok)found[n]=await r.json();else if(r.status==404)found[n]=[]}catch(e){}
    prog(++done,list.length)}}));
  var hit=0;
  items.forEach(function(it){
    var k=baseName(it.name),all=found[k]||[];
    var cs=all.filter(function(x){return nk(x.name)==nk(k)});if(!cs.length)cs=all;
    cs=cs.map(function(x){var sid=x.id.slice(0,x.id.lastIndexOf('-'));return{x:x,sid:sid,sn:sets[sid]||sid}});
    var byNum=it.num?cs.filter(function(c){return nnum(c.x.localId)==nnum(it.num)}):[];
    var bySet=it.set?cs.filter(function(c){return setHit(c.sn,it.set)||nk(c.sid)==nk(it.set)}):[];
    var m=null;
    if(it.num&&it.set)m=byNum.filter(function(c){return bySet.indexOf(c)>-1})[0]||(byNum.length==1&&cs.length>0&&!bySet.length?byNum[0]:null);
    else if(it.num)m=byNum.length==1?byNum[0]:null;
    else if(it.set)m=bySet.length==1?bySet[0]:null;
    if(m){hit++;it.api=m.x.id;it.img=m.x.image?m.x.image+'/low.webp':'';it.name=m.x.name;it.set=m.sn;it.num=m.x.localId}
  });
  return hit;
}
function impAdd(b,it){
  var m=b.cards.filter(function(x){
    if(x.cond!=it.cond||(x.v||'')!=(it.pr||''))return false;
    if(it.api)return x.api==it.api;
    return !x.api&&x.name.toLowerCase()==it.name.toLowerCase()&&(x.set||'').toLowerCase()==(it.set||'').toLowerCase()&&(x.num||'')==(it.num||'');
  })[0];
  if(m){m.qty+=it.qty;return}
  var c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:it.name,set:it.set||'',num:it.num||'',qty:it.qty,cond:it.cond};
  if(it.api){c.api=it.api;if(it.img)c.img=it.img}
  if(it.pr)c.v=it.pr;
  b.cards.unshift(c);
}
async function impGo(){
  if(!IMP||IMP.busy||IMP.map.name<0)return;
  var bid=IMP.box,items=impItems();if(!items.length)return;
  IMP.busy=true;impDraw();
  function st(t){var e=$('#imps');if(e)e.textContent=t}
  var hit=0;
  if(IMP.look){st('Matching cards…');try{hit=await impMatch(items,function(d,n){st('Matching cards… '+d+' of '+n)})}catch(e){}}
  var b=S.boxes[bid];if(!b){IMP=null;return}
  var n=0;for(var i=items.length-1;i>=0;i--){impAdd(b,items[i]);n+=items[i].qty}
  save();
  var msg='Imported '+n+' card'+(n==1?'':'s')+'.';
  if(IMP&&IMP.look)msg+=hit==items.length?' All of them were matched, so tap Update prices to get their values.':' '+hit+' of '+items.length+' were matched to the card database'+(hit?' (tap Update prices to get their values)':'')+'. The rest were added by hand and won’t be priced.';
  if(location.hash.slice(1)==bid){IMP={msg:msg,box:bid};render()}else IMP=null;
  var h=location.hash;fillTypes().then(function(ch){if(ch&&location.hash==h){filtBar();list()}});
}

function hiImg(u){return String(u||'').replace(/\/low\.(webp|png|jpg)$/,'/high.webp')}
var TCGI='https://tcgplayer-cdn.tcgplayer.com/product/';
// TCGplayer product ids come from the card details (variants_detailed[].thirdParty.tcgplayer), one per printing
function tpOf(j){
  var m={},any=0;
  (j&&j.variants_detailed||[]).forEach(function(x){var id=x&&x.thirdParty&&x.thirdParty.tcgplayer;if(typeof id=='number'&&id>0){var t=String(x.type||'').toLowerCase();if(!m[t])m[t]=id;if(!any)any=id}});
  if(!any&&j&&j.thirdParty&&typeof j.thirdParty.tcgplayer=='number')any=j.thirdParty.tcgplayer;
  if(!any&&j&&j.pricing&&j.pricing.tcgplayer&&typeof j.pricing.tcgplayer.productId=='number')any=j.pricing.tcgplayer.productId;
  m._=any;return m;
}
function tpPick(m,v){if(!m)return 0;var k=Object.keys(m).filter(function(x){return x!='_'});var hit=v&&k.filter(function(x){return x==v||(v=='reverse'?/reverse/.test(x):v=='holo'?/holo|foil/.test(x)&&!/reverse/.test(x):/normal|unlimited/.test(x))})[0];return(hit&&m[hit])||m.normal||m._||0}
function imgs(c){
  var lo=c.img||'',hi=lo?hiImg(lo):'';
  if(c.tp>0)return{lo:TCGI+c.tp+'_200w.jpg',hi:TCGI+c.tp+'_in_1000x1000.jpg',lo2:lo,hi2:hi||lo};
  return{lo:lo,hi:hi,lo2:'',hi2:lo};
}
function thumb(c){
  var i=imgs(c);if(!i.lo)return'';
  return'<img class="th" src="'+esc(i.lo)+'" data-hi="'+esc(i.hi)+'" data-hi2="'+esc(i.hi2)+'"'+(i.lo2?' data-lo2="'+esc(i.lo2)+'" onerror="thErr(this)"':'')+' alt="'+esc(c.name)+'">';
}
function thErr(t){var f=t.getAttribute('data-lo2');t.removeAttribute('onerror');t.onerror=null;t.removeAttribute('data-lo2');if(f){t.setAttribute('data-hi',t.getAttribute('data-hi2')||f);t.src=f}}
function imgChain(im,list,done){var i=0;function next(){while(i<list.length&&!list[i])i++;if(i>=list.length){done&&done();return}im.src=list[i++]}im.onerror=next;next()}
var ZM=null,ZT=null;
function canHover(){try{return matchMedia('(hover:hover) and (pointer:fine)').matches}catch(e){return false}}
function zoomEl(){if(!ZM){ZM=document.createElement('div');ZM.id='zoom';ZM.setAttribute('aria-hidden','true');ZM.innerHTML='<img alt="">';document.body.appendChild(ZM)}return ZM}
function showZoom(t){
  var z=zoomEl(),im=z.firstChild,w=Math.min(280,Math.max(160,innerWidth*0.38)),hh=w*825/600,r=t.getBoundingClientRect();
  ZT=t;z.style.width=w+'px';z.style.backgroundImage='url("'+t.src.replace(/"/g,'%22')+'")';
  im.style.visibility='hidden';im.onload=function(){im.style.visibility=''};imgChain(im,[t.getAttribute('data-hi'),t.getAttribute('data-hi2')],function(){im.style.visibility='hidden'});
  var x=r.right+14;if(x+w>innerWidth-8)x=r.left-14-w;if(x<8)x=Math.max(8,(innerWidth-w)/2);
  var y=Math.min(Math.max(8,r.top+r.height/2-hh/2),innerHeight-hh-8);
  z.style.left=x+'px';z.style.top=Math.max(8,y)+'px';z.style.display='block';
}
function hideZoom(){ZT=null;if(ZM)ZM.style.display='none'}
function openLb(t){
  hideZoom();closeLb();
  var lb=document.createElement('div');lb.id='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-label',t.alt||'Card image');
  lb.innerHTML='<img alt="'+esc(t.alt||'')+'">';var im=lb.firstChild;imgChain(im,[t.getAttribute('data-hi'),t.getAttribute('data-hi2'),t.src]);
  lb.onclick=closeLb;document.body.appendChild(lb);
}
function closeLb(){var l=$('#lb');if(l)l.remove()}
document.addEventListener('mouseover',function(e){var t=e.target;if(t&&t.matches&&t.matches('img.th[data-hi]')&&canHover())showZoom(t)});
document.addEventListener('mouseout',function(e){if(e.target===ZT)hideZoom()});
document.addEventListener('click',function(e){var t=e.target;if(t&&t.matches&&t.matches('img.th[data-hi]')){e.preventDefault();openLb(t)}});
document.addEventListener('keydown',function(e){if(e.key=='Escape')closeLb()});
window.addEventListener('scroll',hideZoom,{passive:true});
window.addEventListener('hashchange',function(){hideZoom();closeLb()});
function pend(v){try{if(v)localStorage.setItem('pkbox:pending',v);else localStorage.removeItem('pkbox:pending')}catch(e){}}
function pending(){try{return localStorage.getItem('pkbox:pending')||''}catch(e){return''}}
function goPending(){var p=pending();if(U&&p&&!location.hash.slice(1))location.hash=p}
async function tagView(app,id){
  if(!sb){app.innerHTML='<a class="back" href="#">← All boxes</a><p class="sub">Box registration isn’t available right now.</p>';return}
  app.innerHTML='<a class="back" href="#">← All boxes</a><p class="sub">Checking this box…</p>';
  var s='';
  try{var r=await sb.rpc('tag_status',{c:id});if(!r.error)s=r.data}catch(e){}
  if(location.hash.slice(1)!==id||S.boxes[id])return;
  if(s!='unclaimed'&&pending()==id)pend('');
  var back='<a class="back" href="#">← All boxes</a>',h='';
  if(s=='unclaimed'){
    pend(id);
    if(!U){want=id;h=back+'<h1>Register your box</h1><p class="sub">Create a free account or sign in (above) to add this box to your collection and keep it synced across your devices.</p>'}
    else h=back+'<h1>Register your box</h1><p class="sub">This box is ready to be added to your account.</p><div class="card"><label class="l">Name this box</label><div class="row"><input id="bn" class="grow" value="My Deck Box"><button class="pri" onclick="claim(\''+esc(id)+'\')">Register</button></div><p class="note err" id="cm"></p></div>';
  }else if(s=='yours'){
    if(U){await sync();if(S.boxes[id]){render();return}}
    h=back+'<h1>Welcome back</h1><p class="sub">This box is registered to your account. Name it to start tracking its cards.</p><div class="card"><div class="row"><input id="bn" class="grow" value="My Deck Box"><button class="pri" onclick="makeBox(\''+esc(id)+'\')">Continue</button></div></div>';
  }else if(s=='taken'){
    if(!U){want=id;h=back+'<h1>Box already registered</h1><p class="sub">This box has already been registered. If it’s yours, sign in (above) to view it.</p>'}
    else h=back+'<h1>Box already registered</h1><p class="sub">This box is registered to a different account.'+(CONTACT?' '+esc(CONTACT):' If you think this is a mistake, please contact the shop.')+'</p>';
  }else if(s=='unknown'){h=back+'<h1>Box not found</h1><p class="sub">We couldn’t find a box with this code. Check the code, or tap the tag again.</p>'}else{h=back+'<h1>Couldn’t check this box</h1><p class="sub">Please check your connection and try again.</p>'}
  if(location.hash.slice(1)!==id||S.boxes[id])return;
  app.innerHTML=h;bar();
}
async function claim(id){
  var n=($('#bn').value||'').trim()||'My Deck Box',cm=$('#cm'),r;
  try{r=await sb.rpc('claim_tag',{c:id})}catch(e){r={error:e}}
  if(r.error||!r.data){if(cm)cm.textContent='Could not register this box. Please try again.';return}
  if(r.data=='claimed'){pend('');S.boxes[id]={name:n,cards:[],t:Date.now()};save();render();return}
  render();
}
function goCode(){var c=slug(($('#bc').value||'').trim());if(c)location.hash=c}
function exRows(){
  var b=cur();if(!b)return[];
  return sortRows(fltRows(b.cards)).map(function(c){
    var ks=prKeys(c),pr=ks.length?prName(c.v&&ks.indexOf(c.v)>-1?c.v:ks[0]):'',v=cv(c);
    return{name:c.name,set:c.set||'',num:c.num||'',qty:c.qty,cond:c.cond,cat:c.cat||'',ty:c.ty||'',pr:pr,v:v};
  });
}
function exStatus(t){var e=$('#exs');if(e){e.textContent=t;setTimeout(function(){if(e.textContent==t)e.textContent=''},2500)}}
function listText(){
  var b=cur(),rows=exRows(),tot=0,n=0,lines=[b.name+(fltOn()?' (filtered: '+fltDesc()+')':''),''];
  rows.forEach(function(r){
    n+=r.qty;if(r.v!=null)tot+=r.v*r.qty;
    var d=[r.set,r.num&&'#'+r.num].filter(Boolean).join(' ');
    var x=[r.cond,r.pr,r.cat&&r.ty?r.cat+' / '+r.ty:r.cat].filter(Boolean).join(', ');
    lines.push(r.qty+'x '+r.name+(d?' ('+d+')':'')+(x?' ['+x+']':'')+(r.v!=null?' ~'+fmt(r.v)+' each':''));
  });
  lines.push('','Total cards: '+n);
  var pc=rows.filter(function(r){return r.v!=null}).length;
  if(pc)lines.push('Estimated value: '+fmt(tot)+(pc<rows.length?' ('+pc+' of '+rows.length+' priced)':''));
  return lines.join('\n');
}
function copyList(){
  var b=cur();if(!b||!b.cards.length){exStatus('Nothing to copy yet.');return}
  var t=listText(),ok=function(){exStatus(fltOn()?'Copied filtered list!':'Copied!')},fb=function(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var r=false;try{r=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);exStatus(r?'Copied!':'Copy failed. Try Download CSV instead.');
  };
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dlCsv(){
  var b=cur();if(!b||!b.cards.length){exStatus('Nothing to export yet.');return}
  var out=[['Name','Set','Number','Quantity','Condition','Category','Type','Printing','Est. value each (USD)','Est. value total (USD)']];
  exRows().forEach(function(r){out.push([r.name,r.set,r.num,r.qty,r.cond,r.cat,r.ty,r.pr,r.v!=null?r.v.toFixed(2):'',r.v!=null?(r.v*r.qty).toFixed(2):''])});
  var csv='﻿'+out.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
  var a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.href=u;a.download=(slug(b.name)||'deck-dex')+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u)},1000);exStatus(fltOn()?'Downloaded filtered list.':'Downloaded.');
}
function chg(i,d){var b=cur();b.cards.forEach(function(c){if(c.id==i)c.qty=Math.max(0,c.qty+d)});b.cards=b.cards.filter(function(c){return c.qty>0});save();render()}
