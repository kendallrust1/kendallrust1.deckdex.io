<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
a{color:var(--acc)}
.back{display:inline-block;margin-bottom:12px;font-size:.92rem;text-decoration:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.grow{flex:1 1 140px}.sm{flex:0 0 78px}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:9px 13px}
button:hover{filter:brightness(1.08)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.ghost{border:none;background:none;color:var(--mute);padding:6px 8px;font-weight:400}
button.ghost:hover{filter:none;color:var(--ink)}
.stats{display:flex;gap:18px;margin:10px 0 16px}
.stat b{display:block;font-size:1.4rem}.stat span{color:var(--mute);font-size:.8rem}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:.78rem;color:var(--mute)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .t{flex:1;min-width:0}.item .t b{display:block;overflow-wrap:anywhere}
.item .t small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}.qty button{padding:4px 11px}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.boxlink{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink)}
.boxlink small{color:var(--mute)}
label.l{display:block;font-size:.8rem;color:var(--mute);margin:0 0 4px}
details{margin-top:18px}summary{cursor:pointer;color:var(--mute)}
textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,monospace;margin-top:8px}
.note{font-size:.85rem;color:var(--mute);margin-top:8px}
.th{width:40px;height:56px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
#res{margin-top:6px}
select.pr{padding:3px 6px;font-size:.8rem}
.acct{font-size:.88rem;color:var(--mute)}
.err{color:#ff8f87}
.hd{max-width:720px;margin:0 auto;padding:16px 16px 0}.hd a{display:block}.hd svg,.hd img{display:block;width:100%;height:auto;border-radius:14px}
</style>

<script>
var KEY='pkbox:v1',S={boxes:{}},q='';
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)||S;if(!S.boxes)S.boxes={}}catch(e){}

var SUPABASE_URL='https://acobfzadvymmrmuywtxm.supabase.co',SUPABASE_KEY='sb_publishable_4313Hd13DH1fg3gF2bUCGw_aClDsIhl';

function setSt(s){st=s;var e=$('#st');if(e)e.textContent=s}

async function doPush(){
  if(!sb||!U)return;

  Object.keys(S.boxes).forEach(function(i){var b=S.boxes[i];if(!CODE.test(i))return;if(!b.t)b.t=Date.now();if(b.t>(b.s||0))rows.push({user_id:U.id,id:i,name:b.name,cards:b.cards,updated_at:new Date(b.t).toISOString()})});
  try{
    if(S.gone&&S.gone.length){var g=await sb.from('boxes').delete().in('id',S.gone);if(g.error)throw g.error;S.gone=[]}
    if(rows.length){var r=await sb.from('boxes').upsert(rows,{onConflict:'user_id,id'});if(r.error)throw r.error;rows.forEach(function(x){S.boxes[x.id].s=Date.parse(x.updated_at)})}
    persist();setSt('Synced');
  }catch(e){setSt('Sync failed. Changes are kept on this device.')}
}
async function sync(){
  if(!sb||!U)return;setSt('Syncing…');
  var r=await sb.from('boxes').select('id,name,cards,updated_at');
  if(r.error){setSt('Sync failed. Changes are kept on this device.');return}
  var ch=false;
  (r.data||[]).forEach(function(w){
    if((S.gone||[]).indexOf(w.id)>-1)return;
    var t=Date.parse(w.updated_at),l=S.boxes[w.id];
    if(!l||t>(l.t||0)){S.boxes[w.id]={name:w.name,cards:w.cards||[],t:t,s:t};ch=true}
  });
  persist();await doPush();

}

}
async function auth(m){
  var e=$('#ae').value.trim(),p=$('#ap').value,am=$('#am');am.textContent='';
  if(!e||p.length<6){am.textContent='Enter an email and a password of at least 6 characters.';return}

  if(!confirm('Sign out? Your cards stay in your account and are removed from this device.'))return;

}

  var p=$('#np').value;
  if(p.length<6){msg('Use at least 6 characters.',1);return}
  var r=await sb.auth.updateUser({password:p});
  if(r.error){msg(r.error.message,1);return}
  rec=false;render();sync();
}
async function initAuth(){
  if(!sb)return;
  try{var s=await sb.auth.getSession();U=s.data.session?s.data.session.user:null}catch(e){}
  if(/error_code=|error=access_denied/.test(ARR))NOTE='That email link has expired or was already used. Sign in below, or use Forgot password to get a new one.';
  else if(/[?&]code=|type=signup/.test(ARR))NOTE=U?'You\u2019re signed in.':'Email confirmed. Please sign in to continue.';
  sb.auth.onAuthStateChange(function(ev,sess){var nu=sess?sess.user:null,chg=(nu&&nu.id)!=(U&&U.id);U=nu;if(ev==='PASSWORD_RECOVERY')rec=true;if(chg||ev==='PASSWORD_RECOVERY'){render();if(U&&!rec){setTimeout(sync,0);goPending()}}});
  render();if(U){sync();goPending()}
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&U)sync()});
}

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}

  var id=location.hash.slice(1),app=$('#app');if(id.indexOf('=')>-1)id='';want='';

  app.innerHTML=h;

function makeBox(id){var n=$('#bn').value.trim()||id;S.boxes[id]={name:n,cards:[],t:Date.now()};save();render()}

function boxView(app,id,b){

function list(){

    return '<div class="item">'+(c.img?'<img class="th" src="'+esc(c.img)+'" alt="">':'')+'<div class="t"><b>'+esc(c.name)+'</b><small>'+esc([c.set,c.num&&'#'+c.num].filter(Boolean).join(' · '))+'</small>'+(priced(c)?' <small>· ~'+fmt(c.p*COND[c.cond])+' each</small>':'')+' <span class="chip">'+esc(c.cond)+'</span> '+(c.cat?'<span class="chip">'+esc(c.cat)+'</span> ':'')+(c.ty?'<span class="chip">'+esc(c.ty)+'</span> ':'')+prSel(c)+'</div>'
    +'<div class="qty"><button onclick="chg(\''+c.id+'\',-1)" aria-label="Fewer">−</button><b>'+c.qty+'</b><button onclick="chg(\''+c.id+'\',1)" aria-label="More">+</button></div>'
    +'<button class="ghost" onclick="rm(\''+c.id+'\')" aria-label="Remove">✕</button></div>'}).join('');
}
function cur(){return S.boxes[location.hash.slice(1)]}
function addCard(e){
  e.preventDefault();var b=cur();if(!b)return false;
  var c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:$('#cn').value.trim(),set:$('#cs').value.trim(),num:$('#cx').value.trim(),qty:Math.max(1,parseInt($('#cq').value)||1),cond:$('#cc').value};
  if(!c.name)return false;
  var m=b.cards.filter(function(x){return x.name.toLowerCase()==c.name.toLowerCase()&&x.set.toLowerCase()==c.set.toLowerCase()&&x.num==c.num&&x.cond==c.cond})[0];
  if(m)m.qty+=c.qty;else b.cards.unshift(c);
  save();render();return false;
}

var SORTS=[['new','Newest added'],['az','Name A–Z'],['za','Name Z–A'],['cat','Category (Pokémon / Trainer / Energy)'],['type','Pokémon type'],['vhi','Value: high to low'],['vlo','Value: low to high']];
var srt='new';try{srt=localStorage.getItem('pkbox:sort')||'new'}catch(e){}
if(!SORTS.some(function(o){return o[0]==srt}))srt='new';
function detOf(j){var c=j.category,p=(c=='Pokemon'||c=='Pok\u00e9mon');return{cat:p?'Pok\u00e9mon':(c||''),ty:p?((j.types&&j.types[0])||''):''}}
function norm(c){if(!c.cat&&c.ty){if(c.ty=='Trainer'||c.ty=='Energy'){c.cat=c.ty;c.ty=''}else c.cat='Pok\u00e9mon'}}
function catRank(c){var t=c.cat;return t=='Pok\u00e9mon'?0:t=='Trainer'?1:t=='Energy'?2:3}
function cv(c){return priced(c)?c.p*COND[c.cond]:null}
function cmpName(a,b){return a.name.localeCompare(b.name,undefined,{sensitivity:'base',numeric:true})||String(a.set).localeCompare(String(b.set))||String(a.num).localeCompare(String(b.num),undefined,{numeric:true})}
function sortRows(rows){
  var r=rows.slice();r.forEach(norm);
  if(srt=='az')r.sort(cmpName);
  else if(srt=='za')r.sort(function(a,b){return cmpName(b,a)});
  else if(srt=='cat')r.sort(function(a,b){return catRank(a)-catRank(b)||(a.ty||'').localeCompare(b.ty||'')||cmpName(a,b)});
  else if(srt=='type')r.sort(function(a,b){return(a.ty?0:1)-(b.ty?0:1)||(a.ty||'').localeCompare(b.ty||'')||catRank(a)-catRank(b)||cmpName(a,b)});
  else if(srt=='vhi'||srt=='vlo')r.sort(function(a,b){var x=cv(a),y=cv(b);if(x==null&&y==null)return cmpName(a,b);if(x==null)return 1;if(y==null)return-1;return(srt=='vhi'?y-x:x-y)||cmpName(a,b)});
  return r;
}
async function fillTypes(){
  var b=cur();if(!b)return false;
  var ids=[];b.cards.forEach(function(c){norm(c);if(c.api&&!c.cat&&!TRIED[c.api]&&ids.indexOf(c.api)<0)ids.push(c.api)});
  ids.forEach(function(i){TRIED[i]=1});
  if(!ids.length)return false;
  var got={},qu=ids.slice();
  await Promise.all([1,2,3,4,5].map(async function(){while(qu.length){var cid=qu.shift();try{var r=await fetch('https://api.tcgdex.net/v2/en/cards/'+encodeURIComponent(cid));if(r.ok){var d=detOf(await r.json());if(d.cat)got[cid]=d}}catch(e){}}}));
  b=cur();if(!b)return false;
  var ch=false;b.cards.forEach(function(c){if(c.api&&got[c.api]&&!c.cat){c.cat=got[c.api].cat;c.ty=got[c.api].ty;ch=true}});
  if(ch)save();
  return ch;
}
function setSort(v){
  srt=v;try{localStorage.setItem('pkbox:sort',v)}catch(e){}
  list();
  if(v=='cat'||v=='type'){var h=location.hash;fillTypes().then(function(ch){if(ch&&location.hash==h)list()})}
}
var FL={cat:'',ty:'',cond:'',set:''},TRIED={};
function fltOn(){return!!(FL.cat||FL.ty||FL.cond||FL.set)}
function fltRows(cards){return cards.filter(function(c){norm(c);return(!FL.cat||c.cat==FL.cat)&&(!FL.ty||c.ty==FL.ty)&&(!FL.cond||c.cond==FL.cond)&&(!FL.set||c.set==FL.set)})}
function fltDesc(){return[FL.cat,FL.ty,FL.cond,FL.set].filter(Boolean).join(', ')}
function filtBar(){
  var el=$('#fb'),b=cur();if(!el||!b)return;
  b.cards.forEach(norm);
  function uniq(fn){var o={};b.cards.forEach(function(c){var v=fn(c);if(v)o[v]=1});return Object.keys(o)}
  var cats=['Pokémon','Trainer','Energy'].filter(function(x){return b.cards.some(function(c){return c.cat==x})});
  var tys=uniq(function(c){return c.ty}).sort();
  var cds=Object.keys(COND).concat(['Graded']).filter(function(x){return b.cards.some(function(c){return c.cond==x})});
  var sets=uniq(function(c){return c.set}).sort();
  var opts={cat:cats,ty:tys,cond:cds,set:sets};
  Object.keys(opts).forEach(function(k){if(FL[k]&&opts[k].indexOf(FL[k])<0)FL[k]=''});
  var lab={cat:'All categories',ty:'All Pokémon types',cond:'All conditions',set:'All sets'},h='';
  Object.keys(opts).forEach(function(k){
    if(!opts[k].length)return;
    h+='<select class="grow" aria-label="Filter: '+esc(lab[k])+'" onchange="setFilter(\''+k+'\',this.value)"><option value="">'+esc(lab[k])+'</option>'+opts[k].map(function(v){return'<option value="'+esc(v)+'"'+(FL[k]==v?' selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select>';
  });
  if(fltOn())h+='<button class="ghost" onclick="clearFilters()">Clear filters</button>';
  el.innerHTML=h;
}
function setFilter(k,v){FL[k]=v;filtBar();list()}
function clearFilters(){FL={cat:'',ty:'',cond:'',set:''};filtBar();list()}
var RES=[],tm,SETS=null;
function setsMap(){
  if(SETS)return Promise.resolve(SETS);
  return fetch('https://api.tcgdex.net/v2/en/sets').then(function(r){return r.json()}).then(function(a){SETS={};a.forEach(function(s){SETS[s.id]=s.name});return SETS}).catch(function(){SETS={};return SETS});
}
function srch(v){
  clearTimeout(tm);var el=$('#res');if(!el)return;
  v=v.trim();if(v.length<2){el.innerHTML='';return}
  tm=setTimeout(function(){
    el.innerHTML='<div class="note">Searching…</div>';
    var get=fetch('https://api.tcgdex.net/v2/en/cards?name='+encodeURIComponent(v)).then(function(r){if(r.status==404)return[];if(!r.ok)throw 0;return r.json()});
    Promise.all([get,setsMap()]).then(function(x){
      RES=(x[0]||[]).slice(0,15).map(function(c){var sid=c.id.slice(0,c.id.lastIndexOf('-'));return{id:c.id,name:c.name,number:c.localId,set:x[1][sid]||sid,img:c.image?c.image+'/low.webp':''}});
      el.innerHTML=RES.length?RES.map(function(c,i){return '<div class="item">'+(c.img?'<img class="th" src="'+esc(c.img)+'" alt="" loading="lazy">':'')+'<div class="t"><b>'+esc(c.name)+'</b><small>'+esc(c.set)+' · #'+esc(c.number)+'</small></div><button class="pri" onclick="pick('+i+')">Add</button></div>'}).join(''):'<div class="note">No matches. You can add it by hand instead.</div>';
    }).catch(function(){el.innerHTML='<div class="note">Search is unavailable right now. You can still add cards by hand.</div>'});
  },350);
}
function pick(i){
  var c=RES[i],b=cur();if(!c||!b)return;
  var cond=$('#cc').value,qty=Math.max(1,parseInt($('#cq').value)||1);
  var m=b.cards.filter(function(x){return x.api==c.id&&x.cond==cond&&!x.v})[0];
  if(m)m.qty+=qty;else b.cards.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),api:c.id,name:c.name,set:c.set,num:c.number,qty:qty,cond:cond,img:c.img});
  save();render();
  var h=location.hash;fillTypes().then(function(ch){if(ch&&location.hash==h)render()});
}
var PR_ORDER=['normal','holo','reverse'],PR_NAME={normal:'Normal',holo:'Holo',reverse:'Reverse holo'};
function prKeys(c){
  if(!c.pv)return[];
  return Object.keys(c.pv).filter(function(x){return typeof c.pv[x]=='number'}).sort(function(a,b){var i=PR_ORDER.indexOf(a),j=PR_ORDER.indexOf(b);return(i<0?9:i)-(j<0?9:j)});
}
function prName(k){return PR_NAME[k]||k}
function prSel(c){
  var ks=prKeys(c);if(!ks.length)return'';
  var sel=c.v&&ks.indexOf(c.v)>-1?c.v:ks[0];
  if(ks.length==1)return'<span class="chip">'+esc(prName(ks[0]))+'</span>';
  return'<select class="pr" aria-label="Printing" onchange="setPr(\''+c.id+'\',this.value)">'+ks.map(function(k){return'<option value="'+esc(k)+'"'+(k==sel?' selected':'')+'>'+esc(prName(k))+'</option>'}).join('')+'</select>';
}
function setPr(id,k){
  var b=cur();if(!b)return;
  b.cards.forEach(function(c){if(c.id==id&&c.pv&&typeof c.pv[k]=='number'){c.v=k;c.p=c.pv[k]}});
  save();render();
}
function lastPriced(b){var m=0;b.cards.forEach(function(c){if(c.pt>m)m=c.pt});return m}
async function priceBox(){
  var id=location.hash.slice(1),b=S.boxes[id];if(!b)return;
  var ids=[],ps=$('#pst');
  b.cards.forEach(function(c){if(c.api&&ids.indexOf(c.api)<0)ids.push(c.api)});
  if(!ids.length){if(ps)ps.textContent='Only cards added through search can be priced.';return}
  var got={},gt={},n=0,queue=ids.slice();
  async function one(cid){
    try{
      var r=await fetch('https://api.tcgdex.net/v2/en/cards/'+encodeURIComponent(cid));
      if(r.ok){
        var j=await r.json(),t=j.pricing&&j.pricing.tcgplayer,pv={};
        if(t)Object.keys(t).forEach(function(k){var v=t[k];if(v&&typeof v=='object'&&typeof v.marketPrice=='number')pv[k]=v.marketPrice});
        if(Object.keys(pv).length)got[cid]=pv;var d=detOf(j);if(d.cat)gt[cid]=d;
      }
    }catch(e){}
    n++;var p=$('#pst');if(p)p.textContent='Pricing '+n+' of '+ids.length+'…';
  }
  await Promise.all([1,2,3,4,5].map(async function(){while(queue.length)await one(queue.shift())}));
  b=S.boxes[id];if(!b)return;
  b.cards.forEach(function(c){
    var pv=c.api&&got[c.api];
    if(c.api&&gt[c.api]){c.cat=gt[c.api].cat;c.ty=gt[c.api].ty}
    if(pv){c.pv=pv;var ks=prKeys(c);c.p=pv[c.v&&pv[c.v]!=null?c.v:ks[0]];c.pt=Date.now()}
  });
  save();render();
}
function pend(v){try{if(v)localStorage.setItem('pkbox:pending',v);else localStorage.removeItem('pkbox:pending')}catch(e){}}
function pending(){try{return localStorage.getItem('pkbox:pending')||''}catch(e){return''}}
function goPending(){var p=pending();if(U&&p&&!location.hash.slice(1))location.hash=p}
async function tagView(app,id){
  if(!sb){app.innerHTML='<a class="back" href="#">← All boxes</a><p class="sub">Box registration isn’t available right now.</p>';return}
  app.innerHTML='<a class="back" href="#">← All boxes</a><p class="sub">Checking this box…</p>';
  var s='';
  try{var r=await sb.rpc('tag_status',{c:id});if(!r.error)s=r.data}catch(e){}
  if(location.hash.slice(1)!==id||S.boxes[id])return;
  if(s!='unclaimed'&&pending()==id)pend('');
  var back='<a class="back" href="#">← All boxes</a>',h='';
  if(s=='unclaimed'){
    pend(id);
    if(!U){want=id;h=back+'<h1>Register your box</h1><p class="sub">Create a free account or sign in (above) to add this box to your collection and keep it synced across your devices.</p>'}
    else h=back+'<h1>Register your box</h1><p class="sub">This box is ready to be added to your account.</p><div class="card"><label class="l">Name this box</label><div class="row"><input id="bn" class="grow" value="My Deck Box"><button class="pri" onclick="claim(\''+esc(id)+'\')">Register</button></div><p class="note err" id="cm"></p></div>';
  }else if(s=='yours'){
    if(U){await sync();if(S.boxes[id]){render();return}}
    h=back+'<h1>Welcome back</h1><p class="sub">This box is registered to your account. Name it to start tracking its cards.</p><div class="card"><div class="row"><input id="bn" class="grow" value="My Deck Box"><button class="pri" onclick="makeBox(\''+esc(id)+'\')">Continue</button></div></div>';
  }else if(s=='taken'){
    if(!U){want=id;h=back+'<h1>Box already registered</h1><p class="sub">This box has already been registered. If it’s yours, sign in (above) to view it.</p>'}
    else h=back+'<h1>Box already registered</h1><p class="sub">This box is registered to a different account.'+(CONTACT?' '+esc(CONTACT):' If you think this is a mistake, please contact the shop.')+'</p>';
  }else if(s=='unknown'){h=back+'<h1>Box not found</h1><p class="sub">We couldn’t find a box with this code. Check the code, or tap the tag again.</p>'}else{h=back+'<h1>Couldn’t check this box</h1><p class="sub">Please check your connection and try again.</p>'}
  if(location.hash.slice(1)!==id||S.boxes[id])return;
  app.innerHTML=h;bar();
}
async function claim(id){
  var n=($('#bn').value||'').trim()||'My Deck Box',cm=$('#cm'),r;
  try{r=await sb.rpc('claim_tag',{c:id})}catch(e){r={error:e}}
  if(r.error||!r.data){if(cm)cm.textContent='Could not register this box. Please try again.';return}
  if(r.data=='claimed'){pend('');S.boxes[id]={name:n,cards:[],t:Date.now()};save();render();return}
  render();
}
function goCode(){var c=slug(($('#bc').value||'').trim());if(c)location.hash=c}
function exRows(){
  var b=cur();if(!b)return[];
  return sortRows(fltRows(b.cards)).map(function(c){
    var ks=prKeys(c),pr=ks.length?prName(c.v&&ks.indexOf(c.v)>-1?c.v:ks[0]):'',v=cv(c);
    return{name:c.name,set:c.set||'',num:c.num||'',qty:c.qty,cond:c.cond,cat:c.cat||'',ty:c.ty||'',pr:pr,v:v};
  });
}
function exStatus(t){var e=$('#exs');if(e){e.textContent=t;setTimeout(function(){if(e.textContent==t)e.textContent=''},2500)}}
function listText(){
  var b=cur(),rows=exRows(),tot=0,n=0,lines=[b.name+(fltOn()?' (filtered: '+fltDesc()+')':''),''];
  rows.forEach(function(r){
    n+=r.qty;if(r.v!=null)tot+=r.v*r.qty;
    var d=[r.set,r.num&&'#'+r.num].filter(Boolean).join(' ');
    var x=[r.cond,r.pr,r.cat&&r.ty?r.cat+' / '+r.ty:r.cat].filter(Boolean).join(', ');
    lines.push(r.qty+'x '+r.name+(d?' ('+d+')':'')+(x?' ['+x+']':'')+(r.v!=null?' ~'+fmt(r.v)+' each':''));
  });
  lines.push('','Total cards: '+n);
  var pc=rows.filter(function(r){return r.v!=null}).length;
  if(pc)lines.push('Estimated value: '+fmt(tot)+(pc<rows.length?' ('+pc+' of '+rows.length+' priced)':''));
  return lines.join('\n');
}
function copyList(){
  var b=cur();if(!b||!b.cards.length){exStatus('Nothing to copy yet.');return}
  var t=listText(),ok=function(){exStatus(fltOn()?'Copied filtered list!':'Copied!')},fb=function(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var r=false;try{r=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);exStatus(r?'Copied!':'Copy failed. Try Download CSV instead.');
  };
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dlCsv(){
  var b=cur();if(!b||!b.cards.length){exStatus('Nothing to export yet.');return}
  var out=[['Name','Set','Number','Quantity','Condition','Category','Type','Printing','Est. value each (USD)','Est. value total (USD)']];
  exRows().forEach(function(r){out.push([r.name,r.set,r.num,r.qty,r.cond,r.cat,r.ty,r.pr,r.v!=null?r.v.toFixed(2):'',r.v!=null?(r.v*r.qty).toFixed(2):''])});
  var csv='﻿'+out.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
  var a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.href=u;a.download=(slug(b.name)||'deck-dex')+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u)},1000);exStatus(fltOn()?'Downloaded filtered list.':'Downloaded.');
}
function chg(i,d){var b=cur();b.cards.forEach(function(c){if(c.id==i)c.qty=Math.max(0,c.qty+d)});b.cards=b.cards.filter(function(c){return c.qty>0});save();render()}
function rm(i){var b=cur();b.cards=b.cards.filter(function(c){return c.id!=i});save();render()}
function cp(){var l=$('#lk');l.select();try{navigator.clipboard.writeText(l.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}}
function showBk(){$('#bk').value=JSON.stringify(cur())}
function restore(){try{var o=JSON.parse($('#bk').value);if(o&&Array.isArray(o.cards)){S.boxes[location.hash.slice(1)]={name:String(o.name||'Box'),cards:o.cards};save();render()}}catch(e){alert('That backup text could not be read.')}}
function delBox(){if(confirm('Delete this box and its card list from this device?')){var gid=location.hash.slice(1);delete S.boxes[gid];(S.gone=S.gone||[]).push(gid);save();location.hash=''}}
window.addEventListener('hashchange',function(){q='';NOTE='';FL={cat:'',ty:'',cond:'',set:''};render()});
if(HEADER_IMG)$('#hd').innerHTML='<img src="'+esc(HEADER_IMG)+'" alt="Home">';
render();
initAuth();
</script>
