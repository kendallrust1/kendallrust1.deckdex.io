button.ghost{border:none;background:none;color:var(--mute);padding:6px 8px;font-weight:400}

.stats{display:flex;gap:18px;margin:10px 0 16px}

.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:.78rem;color:var(--mute)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}

.empty{color:var(--mute);text-align:center;padding:18px 0}
.boxlink{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink)}
.boxlink small{color:var(--mute)}
label.l{display:block;font-size:.8rem;color:var(--mute);margin:0 0 4px}
details{margin-top:18px}summary{cursor:pointer;color:var(--mute)}
textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,monospace;margin-top:8px}
.note{font-size:.85rem;color:var(--mute);margin-top:8px}
.th{width:40px;height:56px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
#res{margin-top:6px}
select.pr{padding:3px 6px;font-size:.8rem}
.acct{font-size:.88rem;color:var(--mute)}
.err{color:#ff8f87}
button.danger{background:none;border-color:#ff8f87;color:#ff8f87}
button.danger.solid{background:#ff8f87;color:#242423}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.card.warn{border-color:#ff8f87}

.hd{max-width:720px;margin:0 auto;padding:16px 16px 0}.hd a{display:block}.hd svg,.hd img{display:block;width:100%;height:auto;border-radius:14px}

function norm(c){if(c.g)return;if(!c.cat&&c.ty){if(c.ty=='Trainer'||c.ty=='Energy'){c.cat=c.ty;c.ty=''}else c.cat='Pok\u00e9mon'}}
function catRank(c){var t=c.cat;if(c.g){var L=GCFG[c.g]&&GCFG[c.g].cats||MCATS,i=L.indexOf(t);return i<0?L.length:i}return t=='Pok\u00e9mon'?0:t=='Trainer'?1:t=='Energy'?2:3}
function cv(c){return priced(c)?c.p*COND[c.cond]:null}
function cmpName(a,b){return a.name.localeCompare(b.name,undefined,{sensitivity:'base',numeric:true})||String(a.set).localeCompare(String(b.set))||String(a.num).localeCompare(String(b.num),undefined,{numeric:true})}
function sortRows(rows){
  var r=rows.slice();r.forEach(norm);
  if(srt=='az')r.sort(cmpName);
  else if(srt=='za')r.sort(function(a,b){return cmpName(b,a)});
  else if(srt=='cat')r.sort(function(a,b){return catRank(a)-catRank(b)||(a.ty||'').localeCompare(b.ty||'')||cmpName(a,b)});
  else if(srt=='type')r.sort(function(a,b){return(a.ty?0:1)-(b.ty?0:1)||(a.ty||'').localeCompare(b.ty||'')||catRank(a)-catRank(b)||cmpName(a,b)});
  else if(srt=='vhi'||srt=='vlo')r.sort(function(a,b){var x=cv(a),y=cv(b);if(x==null&&y==null)return cmpName(a,b);if(x==null)return 1;if(y==null)return-1;return(srt=='vhi'?y-x:x-y)||cmpName(a,b)});
  return r;
}

  ids.forEach(function(i){TRIED[i]=1});
  if(!ids.length)return false;
  var got={},qu=ids.slice();

  b=cur();if(!b)return false;

var PR_ORDER=['normal','holo','reverse','nonfoil','foil','etched'],PR_NAME={normal:'Normal',holo:'Holo',reverse:'Reverse holo',nonfoil:'Non-foil',foil:'Foil',etched:'Etched foil',market:'Market'};
function prKeys(c){
  if(!c.pv)return[];
  return Object.keys(c.pv).filter(function(x){return typeof c.pv[x]=='number'}).sort(function(a,b){var i=PR_ORDER.indexOf(a),j=PR_ORDER.indexOf(b);return(i<0?9:i)-(j<0?9:j)});
}

async function priceBox(){
  var id=location.hash.slice(1),b=S.boxes[id];if(!b)return;
  if(gameOf(b)!='pokemon')return pricePro(id);
  var ids=[],ps=$('#pst');
  b.cards.forEach(function(c){if(c.api&&ids.indexOf(c.api)<0)ids.push(c.api)});
  if(!ids.length){if(ps)ps.textContent='Only cards added through search can be priced.';return}
  var got={},gt={},n=0,queue=ids.slice();
  async function one(cid){
    try{
      var r=await fetch('https://api.tcgdex.net/v2/en/cards/'+encodeURIComponent(cid));
      if(r.ok){
        var j=await r.json(),t=j.pricing&&j.pricing.tcgplayer,pv={};
        if(t)Object.keys(t).forEach(function(k){var v=t[k];if(v&&typeof v=='object'&&typeof v.marketPrice=='number')pv[k]=v.marketPrice});
        if(Object.keys(pv).length)got[cid]=pv;var d=detOf(j);d.tm=tpOf(j);gt[cid]=d;
      }
    }catch(e){}
    n++;var p=$('#pst');if(p)p.textContent='Pricing '+n+' of '+ids.length+'…';
  }
  await Promise.all([1,2,3,4,5].map(async function(){while(queue.length)await one(queue.shift())}));
  b=S.boxes[id];if(!b)return;
  b.cards.forEach(function(c){
    var pv=c.api&&got[c.api];
    if(c.api&&gt[c.api]){if(gt[c.api].cat){c.cat=gt[c.api].cat;c.ty=gt[c.api].ty}c.tp=tpPick(gt[c.api].tm,c.v)}
    if(pv){c.pv=pv;var ks=prKeys(c),k=prPick(pv,c.v);if(k)c.v=k;c.p=pv[k||ks[0]];c.pt=Date.now()}
  });
  save();render();
}
function prPick(pv,v){
  if(!v||!pv)return'';if(pv[v]!=null)return v;
  var ks=Object.keys(pv).filter(function(k){return typeof pv[k]=='number'});
  if(v=='reverse')return ks.filter(function(k){return/reverse/i.test(k)})[0]||'';
  if(v=='holo')return ks.filter(function(k){return/holo|foil/i.test(k)&&!/reverse/i.test(k)})[0]||'';
  if(v=='normal')return ks.filter(function(k){return/normal|unlimited/i.test(k)})[0]||'';
  return'';
}

var IMF0=[['name','Card name'],['set','Set'],['num','Number'],['qty','Quantity'],['cond','Condition'],['pr','Printing']],IMFX=IMF0.concat([['code','Set code']]),IMFM=IMFX.concat([['sid','Scryfall ID']]),IMF=IMF0;

  name:['name','cardname','productname','card','cardtitle','title','product','pokemon','pokemonname'],
  set:['set','setname','expansion','expansionname','edition','groupname','setfullname','settitle'],
  num:['number','cardnumber','collectornumber','setnumber','localid','cardno','no','num','nr'],
  qty:['quantity','qty','count','totalquantity','havequantity','ownedquantity','owned','copies','amount','addtoquantity'],
  cond:['condition','cond','cardcondition','grade'],
  pr:['printing','variant','printingtype','printtype','cardvariant','finish','foil','foiltype','version'],
  code:['setcode','editioncode','code','setid','setabbreviation','expansioncode'],

function hk(h){h=String(h||'').trim();return h=='#'?'number':h.toLowerCase().replace(/[^a-z0-9]+/g,'')}
function impDetect(head){
  var gm=gameOf(cur());IMF=gm=='mtg'?IMFM:gm=='pokemon'?IMF0:IMFX;
  var ks=head.map(hk),used={},m={};
  if(IMF!==IMF0)(IMF===IMFM?[['sid'],['code']]:[['code']]).forEach(function(f){IMA[f[0]].some(function(a){for(var i=0;i<ks.length;i++)if(ks[i]==a){m[f[0]]=i;used[i]=1;return true}return false})});
  IMF.forEach(function(f){if(m[f[0]]==null)m[f[0]]=-1});
  [0,1].forEach(function(pass){IMF.forEach(function(f){
    var k=f[0];if(m[k]>-1)return;
    IMA[k].some(function(a){
      if(pass&&a.length<4)return false;
      for(var i=0;i<ks.length;i++)if(!used[i]&&(pass?ks[i].indexOf(a)>-1:ks[i]==a)){m[k]=i;used[i]=1;return true}
      return false;
    });
  })});
  return m;
}
function parseCSV(t){
  t=String(t).replace(/^﻿/,'');
  var first=t.split(/\r?\n/).filter(function(l){return l.trim()&&!/^sep=/i.test(l)})[0]||'';
  var d=[',',';','\t'].sort(function(a,b){return first.split(b).length-first.split(a).length})[0];
  var rows=[],row=[],f='',qt=false,c,i;
  for(i=0;i<t.length;i++){c=t[i];
    if(qt){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else qt=false}else f+=c}
    else if(c=='"'&&!f.trim())qt=true,f='';
    else if(c==d){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return x.trim()})&&!(r.length==1&&/^sep=/i.test(r[0]))});
}
function impCond(v,def){
  var s=String(v||'').toLowerCase().trim();if(!s)return def;
  if(/psa|bgs|cgc|sgc|beckett|grad|slab/.test(s))return'Graded';
  if(/dmg|damag|poor/.test(s))return'DMG';
  if(/heav|\bhp\b/.test(s))return'HP';
  if(/moder|\bmp\b|\bgood\b|\bgd\b/.test(s))return'MP';
  if(/light|\blp\b|excellent|\bex\b|\bsp\b|slight/.test(s))return'LP';
  if(/mint|\bnm\b|\bm\b|\bnew\b/.test(s))return'NM';
  if(/played|\bpl\b/.test(s))return'MP';
  return def;
}
function impPr(v){
  var s=String(v||'').toLowerCase().trim();
  if(/^(true|yes|y|1|x)$/.test(s))return'holo';
  if(/^(false|no|n|0)$/.test(s))return'normal';
  if(/reverse|\brev\b|\brh\b/.test(s))return'reverse';
  if(/non-?\s?(foil|holo)/.test(s))return'normal';
  if(/holo|foil/.test(s))return'holo';
  if(/normal|regular|unlimited|standard/.test(s))return'normal';
  return'';
}
function cell(v){v=String(v==null?'':v).trim();if(/^'[=+\-@]/.test(v))v=v.slice(1);return v}
function impItems(){
  var m=IMP.map,out=[],skip=0;
  IMP.rows.forEach(function(r){
    function g(k){return m[k]>-1?cell(r[m[k]]):''}
    var name=g('name');if(!name)return;
    var num=g('num'),nm=name.match(/\s*[-–(]\s*#?(\w+)\s*\/\s*\w+\s*\)?\s*$/)||name.match(/\s+-\s+#?(\d+\w*)\s*$/);
    if(nm){name=name.slice(0,nm.index).trim();if(!num)num=nm[1]}
    num=num.replace(/^#/,'').split('/')[0].trim();
    var qs=g('qty'),qty=m.qty>-1?parseInt(qs.replace(/[^\d-]/g,''),10):1;
    if(m.qty>-1&&!qs)qty=1;
    if(!(qty>0)){skip++;return}
    var cs=g('cond');
    var pr=impPr(g('pr'))||impPrFromCond(cs);
    var ps=(g('pr')+' '+cs).toLowerCase();
    if(IMP.g=='onepiece')pr='';

    out.push({name:name,set:g('set'),num:num,qty:qty,cond:impCond(cs,IMP.def),pr:pr,code:g('code'),sid:g('sid'),prRaw:ps});
  });
  IMP.skip=skip;return out;
}

function nk(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'')}
function nnum(s){return String(s||'').trim().toLowerCase().replace(/^0+(?=\w)/,'')}
function baseName(s){return String(s||'').replace(/\s*[\(\[][^\)\]]*[\)\]]\s*/g,' ').replace(/\s+-\s+.*$/,'').trim()}
function setHit(a,b){a=nk(a);b=nk(b);if(!a||!b)return false;if(a==b)return true;var s=a.length<b.length?a:b,l=a.length<b.length?b:a;return s.length>=3&&l.indexOf(s)>-1}
async function impMatch(items,prog){
  var sets=await setsMap(),found={},list=[];
  items.forEach(function(it){var k=baseName(it.name);if(k&&!(k in found)){found[k]=null;list.push(k)}});
  var done=0,qu=list.slice();
  await Promise.all([1,2,3,4,5].map(async function(){while(qu.length){var n=qu.shift();
    try{var r=await fetch('https://api.tcgdex.net/v2/en/cards?name='+encodeURIComponent(n));if(r.ok)found[n]=await r.json();else if(r.status==404)found[n]=[]}catch(e){}
    prog(++done,list.length)}}));
  var hit=0;
  items.forEach(function(it){
    var k=baseName(it.name),all=found[k]||[];
    var cs=all.filter(function(x){return nk(x.name)==nk(k)});if(!cs.length)cs=all;
    cs=cs.map(function(x){var sid=x.id.slice(0,x.id.lastIndexOf('-'));return{x:x,sid:sid,sn:sets[sid]||sid}});
    var byNum=it.num?cs.filter(function(c){return nnum(c.x.localId)==nnum(it.num)}):[];
    var bySet=it.set?cs.filter(function(c){return setHit(c.sn,it.set)||nk(c.sid)==nk(it.set)}):[];
    var m=null;
    if(it.num&&it.set)m=byNum.filter(function(c){return bySet.indexOf(c)>-1})[0]||(byNum.length==1&&cs.length>0&&!bySet.length?byNum[0]:null);
    else if(it.num)m=byNum.length==1?byNum[0]:null;
    else if(it.set)m=bySet.length==1?bySet[0]:null;
    if(m){hit++;it.api=m.x.id;it.img=m.x.image?m.x.image+'/low.webp':'';it.name=m.x.name;it.set=m.sn;it.num=m.x.localId}
  });
  return hit;
}
function impAdd(b,it,g){

    if(it.api)return x.api==it.api;
    return !x.api&&x.name.toLowerCase()==it.name.toLowerCase()&&(x.set||'').toLowerCase()==(it.set||'').toLowerCase()&&(x.num||'')==(it.num||'');
  })[0];

  if(it.api){c.api=it.api;if(it.img)c.img=it.img}

  return new Promise(function(r){setTimeout(r,at-now)}).then(function(){return fetch(SFU+path,o)}).then(function(r){
    if(r.status==429&&!retry){SFT[k]=Date.now()+1500;return sf(path,opt,slow,1)}return r});
